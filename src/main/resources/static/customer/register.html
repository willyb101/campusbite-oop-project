<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Registration | Campus Bite</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>

    <div class="login-container">
        <h1>Campus Bite</h1>
        <h2>Create Customer Account</h2>
        <p>Join Campus Bite and order meals around campus.</p>

        <form id="customerRegisterForm">
            <label for="fullName">Full Name</label>
            <input type="text" id="fullName" name="fullName" placeholder="Enter your full name" required>

            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" placeholder="Enter your email" required>

            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Create a password" required>

            <label for="confirmPassword">Confirm Password</label>
            <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm your password" required>

            <button type="submit">Create Account</button>
        </form>

        <p>Already have an account?
            <a href="login.html">Log in here</a>
        </p>

        <a href="../index.html">Back to Home</a>
    </div>

    <script src="../auth.js"></script>
    <script>
        if (campusBiteAuth.getSession('customer')) {
            window.location.href = 'dashboard.html';
        }

        document.getElementById('customerRegisterForm').addEventListener('submit', (event) => {
            event.preventDefault();
            const fullName = document.getElementById('fullName').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (password !== confirmPassword) {
                alert('Passwords do not match.');
                return;
            }

            try {
                campusBiteAuth.register('customer', { name: fullName, email, password });
                window.location.href = 'dashboard.html';
            } catch (error) {
                alert(error.message);
            }
        });
    </script>
</body>
</html>
