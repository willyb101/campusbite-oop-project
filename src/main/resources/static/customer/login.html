<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Login | Campus Bite</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>

    <div class="login-container">
        <h1>Campus Bite</h1>
        <h2>Customer Desk</h2>
        <p>Log in to order your favourite meals.</p>

        <form id="customerLoginForm">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" placeholder="Enter your email" required>

            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Enter your password" required>

            <button type="submit">Log In</button>
        </form>

        <p>Don't have an account?
            <a href="register.html">Register here</a>
        </p>

        <a href="../index.html">Back to Home</a>
    </div>

    <script src="../auth.js"></script>
    <script>
        const session = campusBiteAuth.getSession('customer');
        if (session) {
            window.location.href = 'dashboard.html';
        }

        document.getElementById('customerLoginForm').addEventListener('submit', (event) => {
            event.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            try {
                campusBiteAuth.login('customer', email, password);
                window.location.href = 'dashboard.html';
            } catch (error) {
                alert(error.message);
            }
        });
    </script>
</body>
</html>
