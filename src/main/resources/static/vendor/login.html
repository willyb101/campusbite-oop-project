<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vendor Login | Campus Bite</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>

    <div class="login-container">
        <h1>Campus Bite</h1>
        <h2>Vendor Desk</h2>
        <p>Log in to manage your food business and customer orders.</p>

        <form id="vendorLoginForm">
            <label for="email">Business Email</label>
            <input type="email" id="email" name="email" placeholder="Enter your business email" required>

            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Enter your password" required>

            <button type="submit">Vendor Log In</button>
        </form>

        <p>Not registered as a vendor?
            <a href="register.html">Register your business</a>
        </p>

        <a href="../index.html">Back to Home</a>
    </div>

    <script src="../auth.js"></script>
    <script>
        if (campusBiteAuth.getSession('vendor')) {
            window.location.href = 'dashboard.html';
        }

        document.getElementById('vendorLoginForm').addEventListener('submit', (event) => {
            event.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            try {
                campusBiteAuth.login('vendor', email, password);
                window.location.href = 'dashboard.html';
            } catch (error) {
                alert(error.message);
            }
        });
    </script>
</body>
</html>
