<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Vendor Dashboard | CampusBite</title><link rel="stylesheet" href="../style.css"></head>
<body><header><h1>CampusBite</h1><p>Vendor management dashboard</p></header>
<main class="login-container dashboard-wide"><div class="dashboard-top"><div><h2>Vendor Dashboard</h2><p id="welcomeText">Manage your menu and incoming orders.</p></div><button id="logoutButton" type="button">Log Out</button></div>
<section class="dashboard-panel"><h3>Add food to your menu</h3><form id="menuForm" class="food-upload-form">
<label for="itemName">Food name</label><input type="text" id="itemName" name="itemName" placeholder="e.g. Nshima with chicken" required>
<label for="price">Price (ZMW)</label><input type="number" id="price" name="price" min="0" step="0.01" placeholder="55.00" required>
<label for="foodImage">Food picture (optional)</label><input type="file" id="foodImage" name="foodImage" accept="image/png,image/jpeg,image/webp,image/gif"><small class="form-hint">Choose a JPG, PNG, WEBP or GIF image. Maximum file size: 2 MB.</small>
<div class="image-preview-wrap"><img id="imagePreview" alt="Selected food preview" class="image-preview hidden"><span id="imagePlaceholder">Your selected food picture will appear here.</span></div>
<button type="submit">Add food to menu</button></form><p id="vendorMessage" class="form-message" role="status"></p></section>
<section class="dashboard-panel"><div class="section-title"><h3>Your food menu</h3><button id="refreshMenu" type="button" class="secondary-button">Refresh menu</button></div><div id="menuList">Loading menu...</div></section>
<section class="dashboard-panel"><div class="section-title"><h3>Incoming orders</h3><button id="refreshOrders" type="button" class="secondary-button">Refresh orders</button></div><div id="ordersList">Loading orders...</div></section></main>
<script src="../auth.js"></script><script>
const session = campusBiteAuth.requireSession('vendor', 'login.html');
if (session) document.getElementById('welcomeText').textContent = 'Welcome, ' + (session.businessName || session.name || 'Vendor') + '. Add food, upload pictures and manage orders.';
const $ = id => document.getElementById(id);
const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(url, options={}) { const response=await fetch(url,{headers:{'Content-Type':'application/json'},...options}); const data=await response.json().catch(()=>({})); if(!response.ok) throw new Error(data.error || 'Request failed'); return data; }
function showMessage(message,error=false){$('vendorMessage').textContent=message;$('vendorMessage').className='form-message '+(error?'error':'success');}
let selectedImageData=null;
$('foodImage').addEventListener('change',()=>{const file=$('foodImage').files[0];selectedImageData=null;if(!file){$('imagePreview').classList.add('hidden');$('imagePlaceholder').classList.remove('hidden');return;}if(!['image/jpeg','image/png','image/webp','image/gif'].includes(file.type)){showMessage('Please choose a JPG, PNG, WEBP or GIF image.',true);$('foodImage').value='';return;}if(file.size>2*1024*1024){showMessage('Image is too large. Please choose an image under 2 MB.',true);$('foodImage').value='';return;}const reader=new FileReader();reader.onload=()=>{selectedImageData=reader.result;$('imagePreview').src=selectedImageData;$('imagePreview').classList.remove('hidden');$('imagePlaceholder').classList.add('hidden');};reader.onerror=()=>showMessage('Could not read that image file.',true);reader.readAsDataURL(file);});
async function loadMenu(){try{const menu=await api('/api/menu');$('menuList').innerHTML=menu.length?menu.map(item=>`<article class="vendor-food-row"><img class="vendor-food-image" src="${item.imageData || ''}" alt="${esc(item.itemName)}" onerror="this.style.display='none'" style="${item.imageData?'':'display:none'}"><div class="vendor-food-info"><strong>${esc(item.itemName)}</strong><span>ZMW ${Number(item.price).toFixed(2)}</span><small class="${item.available?'available-text':'unavailable-text'}">${item.available?'Available':'Unavailable'}</small></div><button type="button" class="secondary-button" data-availability="${item.itemId}" data-next="${!item.available}">${item.available?'Mark unavailable':'Make available'}</button><button type="button" class="delete-button" data-delete="${item.itemId}" data-name="${esc(item.itemName)}">Delete</button></article>`).join(''):'<p>No food items yet. Add your first menu item above.</p>';}catch(e){$('menuList').textContent='Could not load menu: '+e.message;}}
async function loadOrders(){try{const orders=await api('/api/orders');$('ordersList').innerHTML=orders.length?orders.map(order=>`<article class="vendor-order"><div class="section-title"><strong>Order #${order.orderId} — ${esc(order.studentName)}</strong><span class="order-status">${esc(order.status==='IN_TRANSIT'?'ON THE WAY':order.status)}</span></div><p>${(order.items||[]).map(line=>`${esc(line.itemName)} × ${line.quantity}`).join('<br>')}</p><p><strong>Delivery:</strong> ${esc(order.deliveryLocation)}<br><strong>Total:</strong> ZMW ${Number(order.totalCost).toFixed(2)}</p><div class="action-row">${order.status==='PENDING'?`<button type="button" data-status="${order.orderId}" data-value="PREPARING">Start preparing</button>`:''}${order.status==='PREPARING'?`<button type="button" data-status="${order.orderId}" data-value="IN_TRANSIT">Carrier picked up · on the way</button>`:''}${order.status==='IN_TRANSIT'?`<button type="button" data-status="${order.orderId}" data-value="DELIVERED">Mark delivered</button>`:''}${order.status!=='PENDING'&&order.status!=='DELIVERED'?`<button type="button" data-status="${order.orderId}" data-value="PENDING">Reset to pending</button>`:''}${order.status==='DELIVERED'?`<button type="button" class="delete-button" data-delete-order="${order.orderId}">Delete delivered order</button>`:''}</div></article>`).join(''):'<p>No orders have been placed yet.</p>';}catch(e){$('ordersList').textContent='Could not load orders: '+e.message;}}
$('menuForm').addEventListener('submit',async event=>{event.preventDefault();const form=event.currentTarget;const payload={itemName:$('itemName').value.trim(),price:Number($('price').value),isAvailable:true,imageData:selectedImageData};try{await api('/api/menu',{method:'POST',body:JSON.stringify(payload)});form.reset();selectedImageData=null;$('imagePreview').src='';$('imagePreview').classList.add('hidden');$('imagePlaceholder').classList.remove('hidden');showMessage('Food item added successfully.');await loadMenu();}catch(e){showMessage(e.message,true);}});
document.addEventListener('click',async event=>{const button=event.target.closest('button');if(!button)return;try{if(button.id==='logoutButton'){campusBiteAuth.clearSession('vendor');location.href='login.html';}if(button.id==='refreshMenu')await loadMenu();if(button.id==='refreshOrders')await loadOrders();if(button.dataset.availability){await api(`/api/menu/${button.dataset.availability}/availability`,{method:'PATCH',body:JSON.stringify({isAvailable:button.dataset.next==='true'})});await loadMenu();}if(button.dataset.delete&&confirm(`Delete "${button.dataset.name}" from your menu?`)){await api(`/api/menu/${button.dataset.delete}`,{method:'DELETE'});showMessage('Food item deleted.');await loadMenu();}if(button.dataset.deleteOrder&&confirm(`Delete delivered order #${button.dataset.deleteOrder}? This cannot be undone.`)){await api(`/api/orders/${button.dataset.deleteOrder}`,{method:'DELETE'});showMessage('Delivered order deleted.');await loadOrders();}if(button.dataset.status){await api(`/api/orders/${button.dataset.status}/status`,{method:'PATCH',body:JSON.stringify({status:button.dataset.value})});await loadOrders();}}catch(e){showMessage(e.message,true);}});
loadMenu();loadOrders();
</script></body></html>
